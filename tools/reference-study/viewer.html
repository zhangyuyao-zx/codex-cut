<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考视频研究</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f0e8;color:#17201e;font:16px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #c6cfc8;background:#fffdf7;color:#173c32;border-radius:7px;padding:7px 12px}button:hover,button.active{background:#d8efb4;border-color:#719555}button:disabled{opacity:.4;cursor:default}header{padding:24px 30px;background:#182621;color:#f9f7ef}h1{font-size:30px;line-height:1.25;margin:6px 0 12px}header p{margin:0;color:#becbc1;font-size:14px}aside{position:sticky;top:0;height:100vh;overflow:auto;background:#e9e9df;padding:18px;border-right:1px solid #d2d8cd}aside button{display:block;width:100%;text-align:left;margin:8px 0;padding:11px;font-size:14px}aside input{width:100%;padding:10px;border:1px solid #bec7ba;border-radius:6px}main{display:grid;grid-template-columns:240px minmax(0,1fr)}article{padding:28px;min-width:0}.eyebrow{font:12px/1.5 ui-monospace,Menlo,monospace;letter-spacing:1px;color:#6b806c}h2{margin:3px 0 15px;font-size:25px;line-height:1.45}h3{font-size:20px;margin:6px 0 12px}.stage,.detailGrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:22px;align-items:start}video{display:block;width:100%;background:#111;aspect-ratio:16/9;border-radius:8px}.controls,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.panel{background:#fffdf7;border:1px solid #d7ded0;padding:20px;border-radius:10px}.panel p{margin:10px 0}.label{font-weight:700;color:#415849;font-size:14px}.notice{border-left:3px solid #d48945;padding:8px 14px;background:#f9f1dd;font-size:14px;margin-top:18px}.tabs{margin:24px 0 16px}.frame{position:relative;width:100%;line-height:0;background:#111;border-radius:8px;overflow:hidden}.frame img{width:100%;height:auto;display:block}.bbox{position:absolute;border:2px solid #ff592c;background:#ff6d2222;pointer-events:none}.list{display:grid;gap:8px;max-height:250px;overflow:auto;margin:12px 0}.item{text-align:left;font-size:14px}.subtle{font-size:13px;color:#647268}.pill{font-size:12px;background:#e9eadd;border-radius:20px;padding:3px 9px;display:inline-block;margin:3px}.row{border-top:1px solid #d4dcca;padding:14px 0}.row p{margin:3px 0}.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.thumbs img{width:100%;border:1px solid #b9c5b1}details{margin:15px 0}summary{cursor:pointer;font-weight:700}.wide{margin-top:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 inherit}.empty{padding:24px;color:#647268;border:1px dashed #b9c5b1;border-radius:8px}a{color:#28675a}@media(max-width:1100px){.stage,.detailGrid{grid-template-columns:1fr}main{grid-template-columns:210px minmax(0,1fr)}article{padding:18px}}@media(max-width:720px){main{display:block}aside{position:relative;height:auto;max-height:230px}article{padding:15px}.thumbs{grid-template-columns:1fr}header{padding:20px}}
video[hidden]{display:none}
</style>
<header><div class="eyebrow" style="color:#bfd69c">REFERENCE STUDY</div><h1 id="title"></h1><p id="summary"></p></header>
<main><aside><input id="search" placeholder="查段落、关系、对象" aria-label="查段落、关系、对象"><div id="sceneList"></div></aside><article>
<div class="eyebrow" id="sceneId"></div><h2 id="sceneTitle"></h2>
<div class="stage"><div><video id="player" controls preload="metadata"></video><div id="noVideo" class="empty" hidden>未绑定原片视频；当前仅浏览图像与记录。</div><div class="controls"><button id="playScene">播放本段</button><button id="back">−1帧</button><button id="forward">＋1帧</button><span id="time" class="subtle"></span></div><p id="timebase" class="subtle"></p></div><div class="panel" id="direction"></div></div>
<div class="tabs"><button data-tab="elements" class="active">元素与子部件</button><button data-tab="sentences">逐句声画</button><button data-tab="events">动作与交接</button><button data-tab="evidence">帧序证据</button><button data-tab="globals">全局元素</button><button data-tab="coverage">核对范围</button></div>
<section id="content"></section><div class="notice">观察、设计解释和迁移建议分别记录。结构检查通过不代表已经看过画面、听过声音或获得用户认可。</div>
</article></main>
<script>
const D=__STUDY_DATA__;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=value=>Array.isArray(value)?value:[];
const describe=value=>typeof value==='string'?value:JSON.stringify(value??'',null,2);
const tm=time=>String(Math.floor(time/60)).padStart(2,'0')+':'+(time%60).toFixed(2).padStart(5,'0');
const btn=(time,label)=>`<button data-time="${time}" ${D.source.localPlayback?'':'disabled'}>${esc(label||tm(time))}</button>`;
let selected=D.scenes[0],tab='elements',currentElement=null,stopAt=null,playEpoch=0;
$('title').textContent=D.title||'参考视频研究';document.title=$('title').textContent;
$('summary').textContent=`${D.scenes.length} 个视觉段落 · ${D.sentences.length} 句 · ${D.elements.length} 个元素组 · ${D.children.length} 个子部件 · ${D.events.length} 条动作记录`;
$('timebase').textContent=`CFR ${D.source.fps}fps；逐帧按钮按源帧率定位。句子时间精度以记录为准。`;
if(D.source.localPlayback){$('player').src=D.source.localPlayback;}else{$('player').hidden=true;$('noVideo').hidden=false;['playScene','back','forward'].forEach(id=>$(id).disabled=true);}
function jump(time,play=false){if(!D.source.localPlayback)return;stopAt=null;playEpoch++;$('player').currentTime=time;if(play)$('player').play().catch(()=>{stopAt=null;});else $('player').pause();}
function playRange(){
 const start=selected.start,end=selected.end,v=$('player');jump(start,true);stopAt=end;const epoch=playEpoch;
 function tick(){
  if(epoch!==playEpoch||stopAt===null)return;
  if(v.currentTime>=end-.5/D.source.fps){
   stopAt=null;v.currentTime=Math.max(Math.ceil(start*D.source.fps),Math.ceil(end*D.source.fps)-1)/D.source.fps;v.pause();return;
  }
  if(v.ended){stopAt=null;return;}
  requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
}
function makeList(){const q=$('search').value.toLowerCase();$('sceneList').innerHTML=D.scenes.filter(s=>JSON.stringify(s).toLowerCase().includes(q)).map(s=>`<button class="${s.id===selected.id?'active':''}" data-scene="${esc(s.id)}"><span class="eyebrow">${esc(s.id)} · ${tm(s.start)}</span><br>${esc(s.title||s.task||s.id)}</button>`).join('');}
function select(id){selected=D.scenes.find(s=>s.id===id)||D.scenes[0];currentElement=null;makeList();$('sceneId').textContent=`${selected.id} / ${tm(selected.start)}–${tm(selected.end)}`;$('sceneTitle').textContent=selected.title||selected.task||selected.id;const a=selected.analysis||{};$('direction').innerHTML=`<h3>${esc(a.question||selected.task)}</h3><p><span class="label">理解变化</span><br>${esc(a.before)} → ${esc(a.after)}</p><p><span class="pill">${esc(a.relation||selected.logic)}</span></p><p>${esc(a.direction)}</p><details><summary>布局、具体对象与适用条件</summary><p>${esc(selected.layout)}</p><p>${esc(selected.main)}</p><p>${esc(a.alternative)}</p><p>${esc(a.transfer)}</p></details>`;render();location.hash=encodeURIComponent(selected.id);}
function drawElement(el){if(!el)return;const box=el.bbox;$('elementFrame').innerHTML=el.image?`<div class="frame"><img src="${esc(el.image)}" alt="证据 ${esc(el.id)}">${box?`<div class="bbox" style="left:${box[0]}%;top:${box[1]}%;width:${box[2]}%;height:${box[3]}%"></div>`:''}</div>`:'<div class="empty">尚未绑定图像证据</div>';const children=D.children.filter(c=>c.parentId===el.id);$('elementText').innerHTML=`<div class="eyebrow">${esc(el.id)} · F${el.frame} · ${tm(el.time)}</div><h3>${esc(el.label||el.id)}</h3><p><span class="label">具体部件及职责</span><br>${children.length?children.map(c=>`<span class="pill">${esc(c.name)}</span> ${esc(c.reason||c.status||'')}<br>`).join(''):arr(el.children).map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</p><p><span class="label">可见文字</span><br>${esc(el.text)}</p><p><span class="label">位置与关系</span><br>${esc(el.position)} ${esc(arr(el.relations).join('；'))}</p><p><span class="label">职责怎样变化</span><br>${esc(el.change)}</p><p><span class="label">设计解释</span><br>${esc(describe(el.analysis))}</p><p class="subtle">${esc(el.analysisType)} ${esc(el.geometryStatus)}</p>${btn(el.time,'定位此状态')}`;}
function elements(items){if(!items.length){$('content').innerHTML='<div class="empty">本类尚无记录，不能据此认定原片没有相关元素。</div>';return;}$('content').innerHTML=`<div class="detailGrid"><div><div id="elementFrame"></div><div class="list">${items.map(e=>`<button class="item" data-element="${esc(e.id)}">${esc(e.label||e.id)} · ${esc(e.id)}</button>`).join('')}</div></div><div class="panel" id="elementText"></div></div>`;drawElement(items.find(x=>x.id===currentElement)||items[0]);}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 if(tab==='elements')return elements(D.elements.filter(e=>e.sceneId===selected.id));
 if(tab==='globals')return elements(D.globals);
 if(tab==='sentences'){$('content').innerHTML=D.sentences.filter(s=>arr(s.segments).includes(selected.id)).map(s=>`<div class="row">${btn(s.start)} <span class="subtle">${esc(s.id)} · 至 ${tm(s.end)} · ${esc(s.timingStatus)}</span><p><strong>${esc(s.textOriginal||s.text||'无转写记录')}</strong></p><p>${esc(s.textMeaning)}</p><p><span class="label">句内逻辑</span> ${esc(s.semantics)}</p><p><span class="label">声画分工</span> ${esc(s.divisionOfLabor)}</p><p><span class="label">时序</span> ${esc(s.timingAnalysis)}</p></div>`).join('')||'<p>没有句子记录。</p>';return;}
 if(tab==='events'){const events=D.events.filter(x=>x.sceneId===selected.id),motion=arr(D.refinedMotion).filter(x=>x.sceneId===selected.id),transitions=D.transitions.filter(x=>x.fromSceneId===selected.id||x.toSceneId===selected.id);$('content').innerHTML=events.map(e=>`<div class="row">${btn(e.time)} <span class="pill">${esc(e.kind)}</span><p>${esc(e.description)}</p><p class="subtle">${esc(e.timeStatus)} ${esc(e.evidenceScope)}</p></div>`).join('')+motion.map(m=>`<div class="panel wide"><h3>${esc(m.name||m.id)}</h3><p>${esc(m.observation)}</p><p class="subtle">${esc(m.precision)}</p>${btn(m.start,tm(m.start)+'–'+tm(m.end))}</div>`).join('')+transitions.map(t=>`<div class="panel wide"><div class="eyebrow">${esc(t.fromSceneId)} → ${esc(t.toSceneId)}</div><h3>${esc(t.kind)}</h3><p>前态：${esc(t.before)}</p><p>过程：${esc(t.process)}</p><p>保留：${esc(t.retained)}</p><p>理解接续：${esc(t.semanticReason)}</p>${btn(t.start,tm(t.start)+'–'+tm(t.end))}</div>`).join('');return;}
 if(tab==='evidence'){const images=[...arr(selected.evidenceSheets),...arr(D.nativeWindows).filter(w=>w.end>=selected.start&&w.start<=selected.end).flatMap(w=>arr(w.sheets))];$('content').innerHTML=`<p>采样密度、窗口及原帧率以本研究记录为准。</p><div class="thumbs">${images.map(p=>`<a href="${esc(p)}" target="_blank" rel="noopener"><img src="${esc(p)}" alt="帧序证据"></a>`).join('')}</div>`;return;}
 if(tab==='coverage'){$('content').innerHTML=`<div class="panel"><h3>实际核对范围与未决项</h3><pre>${esc(describe({status:D.status,coverage:D.coverage,audio:D.audio,limits:D.limits,sceneUncertainties:selected.uncertainties}))}</pre></div>`;}
}
document.addEventListener('click',event=>{const target=event.target.closest('[data-scene],[data-tab],[data-element],[data-time]');if(!target)return;if(target.dataset.scene)select(target.dataset.scene);if(target.dataset.tab){tab=target.dataset.tab;render();}if(target.dataset.element){currentElement=target.dataset.element;drawElement([...D.elements,...D.globals].find(x=>x.id===currentElement));}if(target.dataset.time)jump(Number(target.dataset.time));});
$('search').oninput=makeList;$('playScene').onclick=playRange;$('back').onclick=()=>jump(Math.max(0,$('player').currentTime-1/D.source.fps));$('forward').onclick=()=>jump(Math.min((D.source.frameCount-1)/D.source.fps,$('player').currentTime+1/D.source.fps));$('player').ontimeupdate=()=>{$('time').textContent=`原片 ${tm($('player').currentTime)} / F${Math.round($('player').currentTime*D.source.fps)}`;};$('player').onpause=()=>{stopAt=null;playEpoch++;};
let initialId;try{initialId=decodeURIComponent(location.hash.slice(1));}catch{}select(initialId);$('player').addEventListener('loadedmetadata',()=>jump(selected.start),{once:true});
</script>
</html>
